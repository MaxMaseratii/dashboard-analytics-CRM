<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMM Marketing Hub</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0d10;--panel:#13161b;--panel2:#181c22;--line:#252a33;--text:#e8eaed;--mute:#8b93a1;--acc:#27ffc3;--acc2:#00a884;--vio:#b46cff;--warn:#ffb547;--bad:#ff5c72;--ok:#2ee59d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:48px 24px 80px}
header .eyebrow{color:var(--acc);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
h1{font-size:clamp(34px,5vw,56px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#9ff5dc 60%,#c9a2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.summary{font-size:18px;color:#c9ced6;max-width:780px}
.meta{color:var(--mute);font-size:13px;margin-top:10px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 8px}nav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}nav a:hover{color:var(--text);border-color:var(--acc2);text-decoration:none}
section{margin-top:44px}h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}.cap{color:var(--mute);font-size:13px;margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:30px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--acc2),var(--vio))}
.card.danger:before{background:var(--bad)}
.card .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.card .v{font-size:30px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}.card .s{color:#aeb5c0;font-size:13px}
.card.danger .v{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:11px 14px;border-bottom:1px solid #1d2128;vertical-align:top}tr:last-child td{border-bottom:0}tr:hover td{background:#161a20}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.t-success,.t-Confirmed,.t-Published,.t-Sent,.t-Done{color:var(--ok)}.t-warning,.t-Lower,.t-Engagement{color:var(--warn)}.t-danger,.t-Unverifiable{color:var(--bad)}.t-Video,.t-Scheduled{color:var(--acc)}.t-neutral,.t-Close,.t-Stat,.t-Email{color:#a9b1bd}
.rows{display:grid;gap:10px;margin-top:14px}.row{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.row b{display:block;margin-bottom:2px}.row span.d{color:#aeb5c0;font-size:14px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vid{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.vid video,.vid iframe{width:100%;aspect-ratio:9/16;display:block;background:#000;border:0}
.vid .c{padding:10px 12px}.vid .c b{display:block;font-size:14px}.vid .c small{color:var(--mute)}.vid .lk{display:flex;gap:10px;margin-top:6px;font-size:13px}
.bar{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;margin:10px 0}.bar .tr{height:12px;background:#1d2128;border-radius:6px;overflow:hidden}.bar .fi{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}.small{color:var(--mute);font-size:13px}
.props{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}.props dt{color:var(--mute)}.props dd{margin:0;font-weight:600}
ol.moves{counter-reset:m;list-style:none;padding:0;margin:0;display:grid;gap:10px}ol.moves li{counter-increment:m;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 52px;position:relative}
ol.moves li:before{content:counter(m);position:absolute;left:14px;top:11px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--vio));color:#000;font-weight:700;font-size:13px;display:grid;place-items:center}
svg text{fill:var(--mute);font-size:11px}
footer{margin-top:60px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);padding-top:18px}
.err{color:var(--bad)}
.sb{display:grid;gap:12px}.sbr{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.6fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.sbr .k{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.sbr .n{font-weight:700;font-variant-numeric:tabular-nums}
.sbr .tr{height:10px;background:#1d2128;border-radius:6px;overflow:hidden}.sbr .fi{height:100%;background:linear-gradient(90deg,var(--acc2),var(--vio))}
@media(max-width:820px){.sbr{grid-template-columns:1fr 1fr}}
.t-On,.t-Ahead{color:var(--ok)}.t-Behind{color:var(--bad)}.t-Not,.t-No{color:#a9b1bd}
</style></head><body><div class="wrap" id="app"><p class="small">Loading dashboard...</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=(t,tone)=>`<span class="pill t-${esc((tone||t).split(" ")[0])}">${esc(t)}</span>`;
const link=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:'<span class="small">n/a</span>';
const table=(cols,rows)=>`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const rowsHtml=a=>`<div class="rows">${a.map(([t,d,s,tone])=>`<div class="row"><div><b>${esc(t)}</b><span class="d">${esc(d)}</span></div>${pill(s,tone)}</div>`).join("")}</div>`;
function ytEmbed(u){const m=u&&u.match(/(?:shorts\/|v=)([\w-]{6,})/);return m?`https://www.youtube.com/embed/${m[1]}`:null}
function bars(items){const mx=Math.max(...items.map(i=>i.value),1);return items.map(i=>`<div class="bar"><span>${esc(i.name)}</span><div class="tr"><div class="fi" style="width:${100*i.value/mx}%"></div></div><span class="n">${esc(i.display??i.value)}</span></div>`).join("")}
function line(pts){const W=1000,H=260,P=34,mx=Math.max(...pts.map(p=>p.v))*1.15,n=pts.length;
 const x=i=>P+i*(W-2*P)/(n-1),y=v=>H-P-(v/mx)*(H-2*P);
 const d=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
 const area=d+` L${x(n-1)},${H-P} L${x(0)},${H-P} Z`;
 const lab=pts.map((p,i)=>i%3===0||i===n-1?`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${new Date(p.date+"T12:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>`:"").join("");
 const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#27ffc3"><title>${p.date}: ${p.v}</title></circle>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily store visits"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27ffc3" stop-opacity=".35"/><stop offset="1" stop-color="#27ffc3" stop-opacity="0"/></linearGradient></defs>
 <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="#252a33"/><path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="#27ffc3" stroke-width="2.5"/>${dots}${lab}</svg>`}
function columns(posts){const ch=[["YouTube","yt_views","#27ffc3"],["Facebook","fb_impr","#b46cff"],["X","x_impr","#e8eaed"]];
 const W=600,H=240,P=30,mx=Math.max(...posts.flatMap(p=>ch.map(c=>p[c[1]])),1)*1.1,gw=(W-2*P)/posts.length,bw=gw/4.5;
 let s="";posts.forEach((p,i)=>{ch.forEach((c,j)=>{const v=p[c[1]],h=(v/mx)*(H-2*P);s+=`<rect x="${P+i*gw+gw*.12+j*bw*1.1}" y="${H-P-h}" width="${bw}" height="${h}" rx="3" fill="${c[2]}"><title>${c[0]}: ${v}</title></rect>`});s+=`<text x="${P+i*gw+gw/2}" y="${H-10}" text-anchor="middle">${esc(p.short||p.title)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg><div class="small">${ch.map(c=>`<span style="color:${c[2]}">&#9632;</span> ${c[0]}`).join(" &nbsp; ")}</div>`}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(D=>{
 const pub=D.posts.filter(p=>p.status==="Published");
 const vidCards=D.posts.map(p=>{const yt=ytEmbed(p.youtube);const media=p.video?`<video controls preload="metadata" playsinline src="${esc(p.video)}"></video>`:yt?`<iframe src="${yt}" loading="lazy" allowfullscreen></iframe>`:"";
   return media?`<div class="vid">${media}<div class="c"><b>${esc(p.title)}</b><small>${esc(p.when)} London &middot; ${pill(p.status)}</small><div class="lk">${p.youtube?link(p.youtube,"YouTube"):""}${p.facebook?link(p.facebook,"Facebook"):""}${p.x?link(p.x,"X"):""}</div></div></div>`:""}).join("");
 const batchVids=D.batch.rows.filter(r=>r[6]).map(r=>`<div class="vid"><video controls preload="metadata" playsinline src="${esc(r[6])}"></video><div class="c"><b>${esc(r[3])}</b><small>${esc(r[0])} ${esc(r[1])} London</small></div></div>`).join("");
 const rv=D.revenue;
 $("#app").innerHTML=`
<header><div class="eyebrow">MMM Trading &middot; Marketing, CRM and performance</div><h1>${esc(D.title)}</h1><p class="summary">${esc(D.summary)}</p>
<div class="meta">Last updated ${esc(D.updated)} &middot; Data as of ${esc(D.data_as_of)}</div>
<nav>${[["glance","At a glance"],["targets","Targets vs results"],["batch","Next week"],["calendar","Post calendar"],["channels","Channels"],["crm","Pipeline"],["revenue","Revenue"],["backtest","Backtest check"],["approval","Approvals"],["yesterday","How we did yesterday"],["next","Next moves"]].map(([i,t])=>`<a href="#${i}">${t}</a>`).join("")}<a href="https://www.maxmaserati.com/prop-firms/" target="_blank" rel="noopener">Prop firm comparison ↗</a></nav></header>
<div class="cards" id="glance">${D.cards.map(c=>`<div class="card ${c.tone||""}"><div class="l">${esc(c.label)}</div><div class="v">${esc(c.value)}</div><div class="s">${esc(c.sub)}</div></div>`).join("")}</div>
${(()=>{const S=D.scoreboard;if(!S)return"";const f=(v,u)=>u==="$"?"$"+v:u==="%"?v+"%":v;
return `<section id="targets"><h2>${esc(S.title)}</h2><p class="cap">${esc(S.window)} &middot; day ${S.day} of ${S.days}. ${esc(S.note)}</p>
<div class="sb">${S.rows.map(r=>`<div class="sbr"><div><b>${esc(r.label)}</b></div><div><div class="k">Target</div><div class="n">${esc(r.target)}</div></div><div><div class="k">Target by today</div><div class="n">${esc(f(r.prorated,r.unit))}</div></div><div><div class="k">Actual</div><div class="n">${esc(f(r.actual,r.unit))}</div></div><div><div class="tr"><div class="fi" style="width:${r.pct}%"></div></div><div class="small">${r.pct}% of target</div></div>${pill(r.status)}</div>`).join("")}</div>
<div class="grid2" style="margin-top:14px"><div class="panel"><b>By channel (UTM links)</b>${S.channel_note?`<p class="small">${esc(S.channel_note)}</p>`:""}${table(["Channel","Trials","Sales"],S.channels.map(c=>[esc(c.name),c.trials??'<span class="small">no data yet</span>',c.sales??'<span class="small">no data yet</span>']))}</div>
<div class="panel"><b>Starting point (real data)</b><dl class="props" style="margin-top:8px">${S.baselines.map(b=>`<dt>${esc(b[0])}</dt><dd>${esc(b[1])}</dd>`).join("")}</dl></div></div></section>`})()}
<section id="batch"><h2>Next week's batch</h2><p class="cap">${esc(D.batch.status)} London time.</p><div class="panel" style="margin-bottom:14px">${esc(D.batch.goals)}</div>
${table(["Day","London","Type","Title","Channels","Preview"],D.batch.rows.map(r=>[esc(r[0]),esc(r[1]),pill(r[2]),esc(r[3])+(r[6]?` &middot; ${link(r[6],"watch")}`:""),esc(r[4]),`<span class="small">${esc(r[5])}</span>`]))}
${batchVids?`<div class="vids" style="margin-top:14px">${batchVids}</div>`:""}${rowsHtml(D.batch.notes)}</section>
<section id="calendar"><h2>Post calendar</h2><p class="cap">London time. Watch each video right here.</p>
${table(["Post","When","Status","YouTube","Facebook","X"],D.posts.map(p=>[`<b>${esc(p.title)}</b>`,esc(p.when),pill(p.status),link(p.youtube,"Watch"),link(p.facebook,"Watch"),link(p.x,"Open")]))}
<div class="vids" style="margin-top:14px">${vidCards}</div></section>
<section id="channels"><h2>Channel performance</h2><p class="cap">YouTube counts views; Facebook and X count impressions. ${D.engagement.likes} likes, ${D.engagement.comments} comments, ${D.engagement.clicks} click so far.</p>
<div class="grid2"><div class="panel"><b>Total reach by channel</b>${bars(D.channels)}</div><div class="panel"><b>Reach by post</b>${columns(pub)}</div></div>
<div class="panel" style="margin-top:14px"><b>Daily visits to whop.com/mmmtrading</b><p class="small" style="margin:2px 0 6px">London days. First posts went out 28 Oct.</p>${line(D.visits)}</div></section>
<section id="crm"><h2>Customer pipeline</h2><p class="cap">Counts from Whop. Members are anonymised because this site is public.</p>
${table(["Stage","Count","Detail"],D.pipeline.map(r=>[esc(r[0]),`<b>${esc(r[1])}</b>`,`<span class="small">${esc(r[2])}</span>`]))}${rowsHtml(D.watchlist)}</section>
<section id="revenue"><h2>Revenue this week vs last</h2><p class="cap">Succeeded Whop payments in USD, London weeks.</p>
<div class="grid2"><div class="panel">${bars([{name:rv.last_week.label,value:rv.last_week.usd,display:"$"+rv.last_week.usd.toFixed(2)},{name:rv.this_week.label,value:rv.this_week.usd,display:"$"+rv.this_week.usd.toFixed(2)}])}</div>
<div class="panel"><dl class="props"><dt>Change</dt><dd>${esc(rv.change)}</dd><dt>Renewals</dt><dd>${rv.this_week.renewals} vs ${rv.last_week.renewals}</dd><dt>Not collected this week</dt><dd style="color:var(--bad)">$${rv.not_collected}</dd>${rv.failed.map(f=>`<dt>Failed ${esc(f.date)}</dt><dd>${esc(f.product)} $${f.usd} (${esc(f.reason)})</dd>`).join("")}</dl></div></div></section>
<section id="backtest"><h2>Backtest check</h2><p class="cap">${esc(D.backtest.caption)}</p>
${table(["Stat","Claimed","Recomputed","Verdict"],D.backtest.rows.map(r=>[esc(r[0]),esc(r[1]),esc(r[2]),pill(r[3])]))}<p class="small">${esc(D.backtest.note)}</p></section>
<section id="approval"><h2>Approvals and status</h2>${rowsHtml(D.approvals)}</section>
<section id="yesterday"><h2>How we did yesterday</h2><p class="cap">Daily report, newest day on top, last 7 days. Counts only.</p>${(D.daily_reports||[]).map((d,i)=>`<details class="panel" ${i==0?"open":""} style="margin-bottom:12px"><summary><b>${esc(d.label)}</b> &middot; <span style="color:var(--${d.tone=="bad"?"bad":"good"})">${esc(d.verdict)}</span></summary><p>${esc(d.verdict_why)}</p>${d.channels.map(c=>`<h3>${esc(c.name)} <span class="small">(${esc(c.metric)}; 7-day average ${c.avg.views} ${esc(c.metric)}, ${c.avg.likes} likes, ${c.avg.comments} comments${c.avg.clicks==null?"":", "+c.avg.clicks+" clicks"}${c.avg_note?"; "+esc(c.avg_note):""})</span></h3>`+table(["Time","Post",c.metric,"Likes","Comments","Clicks"],c.posts.map(p=>[esc(p[0]),esc(p[1]),`<b>${p[2]}</b>`,p[3],p[4],p[5]==null?"n/a":p[5]]))).join("")}<dl class="props"><dt>Best</dt><dd>${esc(d.best)}</dd><dt>Worst</dt><dd>${esc(d.worst)}</dd><dt>Followers</dt><dd>${esc(d.followers)}</dd><dt>Whop</dt><dd>${esc(d.whop)}</dd></dl><p><b>What we learned</b></p><ul>${d.learned.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p><b>Improvements</b></p><ol class="moves">${d.suggestions.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><p class="small">${esc(d.source)}</p></details>`).join("")||'<p class="small">No report yet.</p>'}</section>
<section id="next"><h2>Next moves</h2><ol class="moves">${D.next_moves.map(m=>`<li>${esc(m)}</li>`).join("")}</ol></section>
<footer>${esc(D.footer)}<br>${link(D.links.site,"maxmaserati.com")} &middot; ${link(D.links.whop,"Whop")} &middot; ${link(D.links.x,"@Emaxmaserati")}</footer>`;
}).catch(e=>{$("#app").innerHTML=`<p class="err">Could not load data.json: ${esc(e)}</p>`});
</script></body></html>
