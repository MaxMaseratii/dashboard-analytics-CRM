<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-Pay Futures Prop Plans · MMM Marketing Hub</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0d10;--panel:#13161b;--panel2:#181c22;--line:#252a33;--text:#e8eaed;--mute:#8b93a1;--acc:#27ffc3;--acc2:#00a884;--vio:#b46cff;--warn:#ffb547;--bad:#ff5c72;--ok:#2ee59d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:48px 24px 80px}
header .eyebrow{color:var(--acc);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
h1{font-size:clamp(34px,5vw,56px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#9ff5dc 60%,#c9a2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.summary{font-size:18px;color:#c9ced6;max-width:780px}
.meta{color:var(--mute);font-size:13px;margin-top:10px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 8px}nav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}nav a:hover{color:var(--text);border-color:var(--acc2);text-decoration:none}
section{margin-top:44px}h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}.cap{color:var(--mute);font-size:13px;margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:30px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--acc2),var(--vio))}
.card.danger:before{background:var(--bad)}
.card .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.card .v{font-size:30px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}.card .s{color:#aeb5c0;font-size:13px}
.card.danger .v{color:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:11px 14px;border-bottom:1px solid #1d2128;vertical-align:top}tr:last-child td{border-bottom:0}tr:hover td{background:#161a20}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.t-success,.t-Confirmed,.t-Published,.t-Sent,.t-Done{color:var(--ok)}.t-warning,.t-Lower,.t-Engagement{color:var(--warn)}.t-danger,.t-Unverifiable{color:var(--bad)}.t-Video,.t-Scheduled{color:var(--acc)}.t-neutral,.t-Close,.t-Stat,.t-Email{color:#a9b1bd}
.rows{display:grid;gap:10px;margin-top:14px}.row{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.row b{display:block;margin-bottom:2px}.row span.d{color:#aeb5c0;font-size:14px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vid{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.vid video,.vid iframe{width:100%;aspect-ratio:9/16;display:block;background:#000;border:0}
.vid .c{padding:10px 12px}.vid .c b{display:block;font-size:14px}.vid .c small{color:var(--mute)}.vid .lk{display:flex;gap:10px;margin-top:6px;font-size:13px}
.bar{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;margin:10px 0}.bar .tr{height:12px;background:#1d2128;border-radius:6px;overflow:hidden}.bar .fi{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}.small{color:var(--mute);font-size:13px}
.props{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}.props dt{color:var(--mute)}.props dd{margin:0;font-weight:600}
ol.moves{counter-reset:m;list-style:none;padding:0;margin:0;display:grid;gap:10px}ol.moves li{counter-increment:m;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 52px;position:relative}
ol.moves li:before{content:counter(m);position:absolute;left:14px;top:11px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--vio));color:#000;font-weight:700;font-size:13px;display:grid;place-items:center}
svg text{fill:var(--mute);font-size:11px}
footer{margin-top:60px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);padding-top:18px}
.err{color:var(--bad)}
.sb{display:grid;gap:12px}.sbr{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.6fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.sbr .k{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.sbr .n{font-weight:700;font-variant-numeric:tabular-nums}
.sbr .tr{height:10px;background:#1d2128;border-radius:6px;overflow:hidden}.sbr .fi{height:100%;background:linear-gradient(90deg,var(--acc2),var(--vio))}
@media(max-width:820px){.sbr{grid-template-columns:1fr 1fr}}
.t-On,.t-Ahead{color:var(--ok)}.t-Behind{color:var(--bad)}.t-Not,.t-No{color:#a9b1bd}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.ctl label{display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.ctl input,.ctl select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0}
.ctl label.tg{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)}
.ctl label.tg input{width:18px;height:18px;accent-color:var(--acc2)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.seg button{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{color:#000;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;font-weight:600}
details.plan{margin-bottom:10px}details.plan summary{cursor:pointer;font-weight:600}details.plan summary .small{font-weight:400}
details.plan .tw{margin-top:12px}details.plan .props{margin-top:12px}details.plan .props dd{font-weight:400}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
ul.ex{margin:0;padding-left:20px;display:grid;gap:6px;color:#c9ced6}
</style></head><body><div class="wrap" id="app"><p class="small">Loading prop plans...</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=(t,tone)=>`<span class="pill t-${esc(tone)}">${esc(t)}</span>`;
const link=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:'<span class="small">n/a</span>';
const NS="Not stated";
const money=n=>"$"+(Number.isInteger(n)?n.toLocaleString("en-US"):n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
const per1k=z=>z.list!=null&&z.dd?z.list/(z.dd/1000):null;
const st={q:"",dd:"all",size:"all",kind:"all",max:"",monthly:false,sort:"price"};
let D=null;
function sizeOk(z){const s=st.size,m=st.max.trim()===""?null:Number(st.max);
 if(s==="small"&&!(z.k<25))return false;if(s==="250"&&!(z.k>=250))return false;
 if(!["all","small","250"].includes(s)&&z.k!==Number(s))return false;
 if(m!=null&&!isNaN(m)&&(z.list==null||z.list>m))return false;return true}
function render(){
 const t=st.q.trim().toLowerCase();
 const plans=D.plans.filter(p=>(st.monthly||p.billing!=="Monthly")&&(st.dd==="all"||p.dd===st.dd)&&(st.kind==="all"||p.kind===st.kind)&&(!t||(p.firm+" "+p.plan).toLowerCase().includes(t)));
 const rows=[];plans.forEach(p=>p.sizes.forEach(z=>{if(sizeOk(z))rows.push({p,z})}));
 const big=1e12;rows.sort((a,b)=>st.sort==="size"?(a.z.k-b.z.k)||((a.z.list??big)-(b.z.list??big)):st.sort==="per1k"?(per1k(a.z)??big)-(per1k(b.z)??big):(a.z.list??big)-(b.z.list??big));
 const shown=plans.filter(p=>p.sizes.some(sizeOk));const firms=new Set(shown.map(p=>p.firm)).size;
 const oneTime=D.plans.filter(p=>p.billing==="One-time").length;
 $("#cards").innerHTML=[[rows.length,"Account sizes shown"],[shown.length,"Plans shown"],[firms,"Firms shown"],[oneTime,"One-time plans in total"]].map(([v,l])=>`<div class="card"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
 const cols=["Firm · plan","Type","Size","List price","Promo / shown","Drawdown","$ per $1K DD","Target","Daily loss","Billing","Status"],num=new Set([2,3,5,6,7]);
 $("#rows").innerHTML=rows.length?`<div class="tw"><table><thead><tr>${cols.map((c,i)=>`<th class="${num.has(i)?"num":""}">${c}</th>`).join("")}</tr></thead><tbody>${rows.map(({p,z})=>{const r=per1k(z);return `<tr><td><b>${esc(p.firm)}</b> · ${esc(p.plan)}</td><td>${esc(p.dd)} · ${esc(p.kind)}</td><td class="num">${z.k}K</td><td class="num">${z.list!=null?money(z.list):NS}</td><td>${esc(z.promo||"—")}</td><td class="num">${z.dd!=null?money(z.dd):NS}</td><td class="num">${r!=null?money(Math.round(r*100)/100):"—"}</td><td class="num">${z.target!=null?money(z.target):NS}</td><td>${esc(z.dll)}</td><td>${p.billing==="Monthly"?pill("Monthly","warning"):"One-time"}</td><td>${p.status==="Verified"?pill("Verified","success"):pill("Partial","warning")}</td></tr>`}).join("")}</tbody></table></div>`:'<p class="small">No account sizes match these filters.</p>';
 $("#plans").innerHTML=shown.map(p=>`<details class="panel plan"><summary>${esc(p.firm)} · ${esc(p.plan)} <span class="small">&middot; ${esc(p.dd)} &middot; ${esc(p.kind)} &middot; ${esc(p.billing)} &middot; ${p.sizes.length} size${p.sizes.length>1?"s":""}</span></summary>
<dl class="props"><dt>Drawdown</dt><dd>${esc(p.dd)}: ${esc(p.ddNote)}</dd><dt>Plan type / billing</dt><dd>${esc(p.kind)} · ${esc(p.billing)} · no activation fee</dd><dt>Consistency</dt><dd>${esc(p.consistency)}</dd><dt>Payout rules</dt><dd>${esc(p.payout)}</dd><dt>Max accounts</dt><dd>${esc(p.maxAcc)}</dd><dt>Notes</dt><dd>${esc(p.notes)}</dd><dt>Status</dt><dd>${esc(p.status)}, checked ${esc(D.verified_label)}</dd><dt>Source</dt><dd>${link(p.src,p.src)}</dd></dl>
<div class="tw"><table><thead><tr><th class="num">Size</th><th class="num">List price</th><th>Promo / shown</th><th class="num">Drawdown</th><th class="num">Target</th><th>Daily loss</th></tr></thead><tbody>${[...p.sizes].sort((a,b)=>a.k-b.k).map(z=>`<tr><td class="num">${z.k}K</td><td class="num">${z.list!=null?money(z.list):NS}</td><td>${esc(z.promo||"—")}</td><td class="num">${z.dd!=null?money(z.dd):NS}</td><td class="num">${z.target!=null?money(z.target):NS}</td><td>${esc(z.dll)}</td></tr>`).join("")}</tbody></table></div></details>`).join("")||'<p class="small">No plans match these filters.</p>';
 document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.s===st.sort));
}
fetch("prop_plans.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;
 const opt=(a)=>a.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
 $("#app").innerHTML=`
<header><div class="eyebrow">MMM Trading &middot; Prop firm research</div><h1>${esc(D.title)}</h1><p class="summary">${esc(D.summary)}</p>
<div class="meta">Checked ${esc(D.verified_label)} &middot; Criteria: ${D.criteria.map(esc).join(" · ")}</div>
<nav><a href="./">&larr; Dashboard</a><a href="#filters">Filters</a><a href="#sizes">Every size</a><a href="#detail">Plans in detail</a><a href="#excluded">Exclusions</a><a href="#caveats">Caveats</a></nav></header>
<section id="filters"><h2>Filters</h2><div class="ctl">
<label>Search firm or plan<input id="f-q" placeholder="e.g. Lucid"></label>
<label>Drawdown type<select id="f-dd">${opt([["all","Static or EOD"],["EOD","EOD only"],["Static","Static only"]])}</select></label>
<label>Account size<select id="f-size">${opt([["all","All sizes"],["small","Under 25K"],["25","25K"],["50","50K"],["75","75K"],["100","100K"],["150","150K"],["250","250K"]])}</select></label>
<label>Plan type<select id="f-kind">${opt([["all","All plan types"],["Evaluation","Evaluation"],["Instant funded","Instant funded"]])}</select></label>
<label>Max list price (USD)<input id="f-max" type="number" min="0" placeholder="e.g. 200"></label>
<label class="tg"><input id="f-mo" type="checkbox"> Also show monthly-billed plans (no activation, but recurring)</label>
</div><div class="seg">${[["price","Sort: list price"],["per1k","Sort: price per $1K drawdown"],["size","Sort: account size"]].map(([v,l])=>`<button data-s="${v}">${l}</button>`).join("")}</div></section>
<div class="cards" id="cards"></div>
<section id="sizes"><h2>Every matching account size</h2><p class="cap">List price is the standard price; promo is separate. "Not stated" means the firm's page did not show it. Price per $1K drawdown uses list price.</p><div id="rows"></div></section>
<section id="detail"><h2>Plans in detail</h2><p class="cap">Open a plan to see its rules and all its sizes, lowest to highest.</p><div id="plans"></div></section>
<section id="excluded"><h2>Notable exclusions</h2><div class="panel"><ul class="ex">${D.excluded.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div></section>
<section id="caveats"><h2>How to read this</h2><div class="panel"><ul class="ex">${D.caveats.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div></section>
<footer>Data lives in prop_plans.json in this repo. Times are London time. Not financial advice; confirm every rule at checkout.</footer>`;
 const on=(id,ev,fn)=>$(id).addEventListener(ev,fn);
 on("#f-q","input",e=>{st.q=e.target.value;render()});on("#f-dd","change",e=>{st.dd=e.target.value;render()});
 on("#f-size","change",e=>{st.size=e.target.value;render()});on("#f-kind","change",e=>{st.kind=e.target.value;render()});
 on("#f-max","input",e=>{st.max=e.target.value;render()});on("#f-mo","change",e=>{st.monthly=e.target.checked;render()});
 document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{st.sort=b.dataset.s;render()}));
 render();
 if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()}
}).catch(e=>{$("#app").innerHTML=`<p class="err">Could not load prop_plans.json: ${esc(e)}</p>`});
</script></body></html>
